
<!DOCTYPE html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="A professional-grade generative music creation and distribution platform featuring advanced AI vocal transformation, lyric writing studio, mastering tools, and enterprise licensing solutions.">
    <title>SwCafe Business - AI Music Platform</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0a0a0a;
            color: white;
            margin: 0;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
        }
        .custom-scrollbar::-webkit-scrollbar {
            width: 5px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.02);
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 107, 107, 0.3);
        }
        .equalizer {
            display: flex;
            align-items: flex-end;
            height: 15px;
            gap: 1.5px;
        }
        .equalizer-bar {
            width: 2px;
            background: #FF6B6B;
            border-radius: 1px;
            animation: equalize 1s ease-in-out infinite;
        }
        .equalizer-bar:nth-child(1) { height: 30%; }
        .equalizer-bar:nth-child(2) { height: 60%; }
        .equalizer-bar:nth-child(3) { height: 40%; }
        @keyframes equalize {
            0%, 100% { transform: scaleY(1); }
            50% { transform: scaleY(1.5); }
        }
    </style>
